version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors (React, Vite, TypeScript, Playwright) are planned upgrades, re-verified with the browser tests.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
