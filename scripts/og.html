<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; width: 1200px; height: 630px; display: flex; flex-direction: column; justify-content: center; padding: 0 90px;
         box-sizing: border-box; background: #14161a; color: #ece8e1; font-family: system-ui, -apple-system, sans-serif; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: #f7f4ee; color: #14161a; display: grid; place-items: center;
          font: 700 28px Georgia, serif; margin-bottom: 36px; }
  h1 { font: 600 76px 'Iowan Old Style', Palatino, Georgia, serif; margin: 0; }
  p.title { font-size: 34px; color: #5eead4; margin: 14px 0 34px; font-weight: 600; }
  ul { display: flex; gap: 18px; padding: 0; margin: 0; list-style: none; }
  li { padding: 10px 20px; border: 2px solid #2e3238; border-radius: 999px; font-size: 24px; font-weight: 600; }
</style></head><body>
  <div class="mark">VZ</div>
  <h1>Valter Zuliani</h1>
  <p class="title">Software Engineer — Full Stack, Cloud &amp; DevOps</p>
  <ul><li>Yamesi Core</li><li>OpsCircuit</li><li>AtomicTrail</li></ul>
</body></html>
